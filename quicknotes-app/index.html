<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>Capture your ideas instantly.</p>
    </header>

    <main>
      <!-- Section 1: Adding a note -->
      <section>
        <h2>Add a note</h2>
        <form id="note-form">
          <label for="note-input">Your Note:</label>
          <input
            type="text"
            id="note-input"
            placeholder="Type your note here..."
          />

          <label for="note-category">Category:</label>
          <select id="note-category">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="study">Study</option>
          </select>

          <button type="submit">Add Note</button>
        </form>
        <!-- Empty paragraph for validation errors -->
        <p id="error-message"></p>
      </section>

      <!-- Section 2: Viewing and searching notes -->
      <section>
        <h2>Your notes</h2>
        <label for="search-input" style="display: none">Search</label>
        <input type="text" id="search-input" placeholder="Search notes..." />

        <p id="note-count">You have no notes yet.</p>

        <!-- Empty list where JavaScript will inject the notes later -->
        <ul id="notes-list"></ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>
  </body>
</html>
